name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gcp
      - run: npm test
      - run: npm test --prefix gcp
      - run: npm run build
      - run: npm run build --prefix gcp
      - run: npm audit
      - run: npm audit --prefix gcp
